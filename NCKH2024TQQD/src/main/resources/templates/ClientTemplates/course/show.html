<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khóa học - CodeHubt</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
            integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
            crossorigin="anonymous"
    />
    <link rel="stylesheet" th:href="@{/ClientStatic/css/style.css}">
    <link rel="stylesheet" th:href="@{/ClientStatic/css/base.css}">
    <link rel="stylesheet" th:href="@{/ClientStatic/css/footer.css}">
    <link rel="stylesheet" th:href="@{/ClientStatic/css/header.css}">
</head>

<body>
<div class="page-wrapper">
    <div th:replace="~{ClientTemplates/layout/header :: header}"></div>

    <div th:replace="~{ClientTemplates/layout/filter :: filters(filterAction='/course')}"></div>
    <div class="banner">
        <div class="container-fluid px-3">
            <img
                    src="https://codelearn.io/images/training/bg-min.png"
                    alt=""
            />
        </div>
    </div>
    <div class="content-wrapper">
        <div class="container">
            <div class="courses-container">
                <div th:if="${#lists.isEmpty(courses)}" class="text-center text-muted py-5">
                    Chưa có khóa học nào.
                </div>
                <div class="courses-grid" th:unless="${#lists.isEmpty(courses)}">
                    <a th:each="course : ${courses}"
                       th:href="@{/course/{slug}(slug=${course.slug})}"
                       class="course-card">

                        <div class="course-image">
                            <div class="image-placeholder" th:if="${course.imageUrl == null or course.imageUrl.isEmpty()}">
                                <i class="fas fa-laptop-code"></i>
                            </div>
                            <img th:unless="${course.imageUrl == null or course.imageUrl.isEmpty()}"
                                 th:src="${course.imageUrl}"
                                 alt="Course image"/>
                        </div>

                        <div class="course-content">
                            <h3 class="course-title" th:text="${course.title}"></h3>

                            <div class="course-meta">
                                <div class="course-instructor">
                                    <i class="fas fa-user-tie"></i>
                                    <span th:text="${course.instructorUserName != null ? course.instructorUserName : 'CodeHubt Team'}"></span>
                                </div>
                                <div class="course-rating">
                                    <i class="fas fa-star"></i>
                                    <span th:text="${course.rating != null ? course.rating : '0.00'}"></span>
                                </div>
                            </div>

                            <div class="course-pricing">
                                <span th:if="${course.shortDescription != null and !course.shortDescription.isEmpty()}"
                                      th:text="${course.shortDescription}"></span>
                                <span th:if="${course.shortDescription == null or course.shortDescription.isEmpty()}"
                                      th:text="${course.description}"></span>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{ClientTemplates/layout/footer :: footer}"></div>
</div>
<script th:src="@{/ClientStatic/js/script.js}"></script>
</body>

</html>
