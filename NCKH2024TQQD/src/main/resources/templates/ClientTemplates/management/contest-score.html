<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Score Contest</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" th:href="@{/ClientStatic/css/base.css}" />
    <link rel="stylesheet" th:href="@{/ClientStatic/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/ClientStatic/css/header.css}" />
    <link rel="stylesheet" th:href="@{/ClientStatic/css/contest-score.css}" />
  </head>
  <body>
    <div class="page-wrapper">
      <div th:replace="~{ClientTemplates/layout/header :: header}"></div>
      <div class="section-one">
        <div class="inner-title">Quản lý Điểm</div>
      </div>
      <div class="section-three">
        <div class="container">
          <div class="row">
            <table>
              <tr>
                <th>lesson title</th>
                <th>User</th>
                <th>Time</th>
                <th>Score</th>
                <th>Status</th>
              </tr>

              <!-- Lặp qua danh sách submissions -->
              <tr th:each="submission : ${submissions}">
                <td th:text="${submission.lessonTitle}">Lesson Title</td>
                <td th:text="${submission.userName}">User</td>
                <td th:text="${#temporals.format(submission.time, 'dd/MM/yyyy HH:mm')}">Time</td>
                <td th:text="${submission.score}">Score</td>
                <td th:text="${submission.status}">Status</td>
              </tr>
            </table>
          </div>
        </div>
      </div>
      <div th:replace="~{ClientTemplates/layout/footer :: footer}"></div>
    </div>
    <script th:src="@{/ClientStatic/js/manage-edit-lesson.js}"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
      crossorigin="anonymous"
    ></script>

    <script th:src="@{/ClientStatic/js/script.js}"></script>
  </body>
</html>
