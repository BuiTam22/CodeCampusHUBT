<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeHubt - Lịch sử nộp bài</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
          crossorigin="anonymous"/>
    <link rel="stylesheet" th:href="@{/ClientStatic/css/base.css}">
    <link rel="stylesheet" th:href="@{/ClientStatic/css/submission.css}">
    <link rel="stylesheet" th:href="@{/ClientStatic/css/problem_nav.css}">
    <link rel="stylesheet" th:href="@{/ClientStatic/css/footer.css}">
    <link rel="stylesheet" th:href="@{/ClientStatic/css/header.css}">
</head>
<body>

<!-- Header (ngoài page-wrapper, giống coding/submission.html) -->
<div th:replace="~{ClientTemplates/layout/header :: header}"></div>

<!-- Problem Navigation (ngoài page-wrapper) -->
<div th:replace="~{ClientTemplates/layout/problem-nav :: problemNavEssay(slug=${slug}, basePath=${basePath})}"></div>

<!-- page-wrapper chỉ bọc content + footer (giống coding/submission.html) -->
<div class="page-wrapper">

    <div class="inner-head">
        <div class="container">
            <div class="inner-title">Lịch sử nộp bài</div>
        </div>
    </div>

    <div class="section-one">
        <div class="container">
            <div class="row">
                <div class="col-xl-8">
                    <div class="inner-box">
                        <!-- Không có lần nộp nào -->
                        <div th:if="${submissions == null or submissions.isEmpty()}"
                             style="text-align:center; padding: 40px 0; color:#9ca3af;">
                            <i class="fas fa-inbox" style="font-size:2.5rem; margin-bottom:12px; display:block;"></i>
                            <p style="font-size:1rem;">Bạn chưa nộp bài tập này.</p>
                        </div>

                        <!-- Bảng lịch sử nộp -->
                        <table class="custom-table" th:if="${submissions != null and !submissions.isEmpty()}">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Bài tập</th>
                                    <th>Trạng thái</th>
                                    <th>Điểm</th>
                                    <th>Thời gian nộp</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="sub, stat : ${submissions}">
                                    <td th:text="${stat.index + 1}">1</td>
                                    <td>
                                        <a th:href="@{${basePath + '/problem/' + sub.exerciseSlug}}"
                                           th:text="${sub.exerciseTitle}"
                                           style="color:#4f8cff; font-weight:600;">Tên bài</a>
                                    </td>
                                    <td>
                                        <span class="result-true">
                                            <i class="fas fa-paper-plane"></i> Đã nộp
                                        </span>
                                    </td>
                                    <td>
                                        <span th:if="${sub.score != null}"
                                              th:text="${#numbers.formatDecimal(sub.score, 0, 1)}"
                                              style="font-weight:700; color:#16a34a;">0</span>
                                        <span th:if="${sub.score == null}" style="color:#9ca3af;">—</span>
                                    </td>
                                    <td th:text="${sub.submittedAt != null ? #temporals.format(sub.submittedAt, 'dd/MM/yyyy HH:mm') : '—'}">
                                        01/01/2024
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Sidebar -->
                <div class="col-xl-4">
                    <div class="help-box">
                        <h6 class="help-title">LIÊN KẾT</h6>
                        <hr>
                        <div class="help-links">
                            <a th:href="@{${basePath + '/problem/' + slug}}" class="help-link">
                                <i class="fas fa-arrow-left"></i> Quay lại bài tập
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer (bên trong page-wrapper để margin-top:auto hoạt động) -->
    <div th:replace="~{ClientTemplates/layout/footer :: footer}"></div>

</div><!-- end page-wrapper -->

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>
<script th:src="@{/ClientStatic/js/problem-nav.js}"></script>
<script th:src="@{/ClientStatic/js/script.js}"></script>
</body>
</html>
