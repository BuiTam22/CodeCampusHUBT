<div class="filters" th:fragment="filters">
    <form th:action="@{/courses/show}" method="get" id="filterForm">
        <!-- Search box -->
        <input type="text" 
               th:name="search" 
               th:value="${param.search}"
               placeholder="Nhập nội dung tìm kiếm" 
               class="search-box"
               autocomplete="off">

        <!-- Status filter -->
        <select class="dropdown" th:name="status" onchange="this.form.submit()">
            <option value="">Trạng thái</option>
            <option value="noibat" 
                    th:selected="${param.status == 'noibat'}">Nổi bật</option>
            <option value="binhthuong" 
                    th:selected="${param.status == 'binhthuong'}">Bình thường</option>
        </select>

        <!-- Difficulty filter -->
        <select class="dropdown" th:name="difficulty" onchange="this.form.submit()">
            <option value="">Cấp độ</option>
            <option value="easy" 
                    th:selected="${param.difficulty == 'easy'}">Dễ</option>
            <option value="medium" 
                    th:selected="${param.difficulty == 'medium'}">Trung Bình</option>
            <option value="hard" 
                    th:selected="${param.difficulty == 'hard'}">Khó</option>
        </select>
    </form>
</div>
