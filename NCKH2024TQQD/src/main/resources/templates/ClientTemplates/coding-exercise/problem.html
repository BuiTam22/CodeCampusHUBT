<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>CodeHubt</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/ClientStatic/css/problem-show.css}">
</head>

<body>
    <!-- Header -->
    <div th:replace="~{ClientTemplates/layout/header :: header}"></div>

    <!-- Problem Navigation -->
    <div th:replace="~{ClientTemplates/layout/problem-nav :: problemNav}"></div>

    <div class="content-wrapper">
        <div class="container">
            <!-- Problem Statement -->
            <div class="problem-panel">
                <h1 class="problem-title" th:text="${exercise.title}">1. Array Sum</h1>
                <div class="problem-description">
                    <p th:text="${exercise.description}">Given an array of integers, find the sum of its elements.</p>

                    <h3 class="input-format">Định dạng đầu vào</h3>
                    <p><!-- Thêm nếu có thêm trường inputFormat sau này --></p>

                    <h3 class="constraint">Ràng buộc</h3>
                    <p>
                        <span th:text="'Thời gian tối đa: ' + ${exercise.timeLimit} + 'ms'"></span><br/>
                        <span th:text="'Giới hạn bộ nhớ: ' + ${exercise.memoryLimit} + 'MB'"></span>
                    </p>

                    <!-- Sample IO -->
                    <div class="sample-io" th:if="${#lists.size(exercise.exerciseTestCases) > 0}">
                        <div th:each="testCase : ${exercise.exerciseTestCases}">
                            <div th:if="${testCase.public}">
                                <h4>Ví dụ đầu vào</h4>
                                <pre th:text="${testCase.input}">6
1 2 3 4 5 6</pre>
                                <h4>Ví dụ đầu ra</h4>
                                <pre th:text="${testCase.expectedOutput}">21</pre>
                                <!-- Chỉ lấy 1 test case public đầu tiên -->
                                <div th:remove="all"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Code Editor -->
            <div class="editor-panel">
                <div class="editor-header">
                    <span>Code</span>
                    <select class="language-selector">
                        <option th:selected="${exercise.programmingLanguage == 'Python'}">Python 3</option>
                        <option th:selected="${exercise.programmingLanguage == 'Java'}">Java</option>
                        <option th:selected="${exercise.programmingLanguage == 'JavaScript'}">JavaScript</option>
                    </select>
                </div>
                <div class="code-area">
                    <div class="line-numbers" id="lineNumbers"></div>
                    <textarea class="code-editor" id="editor" spellcheck="false"
                              placeholder="// Viết Code vào đây" th:text="${exercise.initialCode}"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Test Cases -->
    <div class="test-cases">
<!--        <h3>Test Cases</h3>-->
<!--        <div class="test-case">-->
<!--            <div class="test-case-header">Trường hợp thử nghiệm 1</div>-->
<!--            <div class="test-case-status passed">✓ Qua</div>-->
<!--        </div>-->
<!--        <div class="test-case">-->
<!--            <div class="test-case-header">Trường hợp thử nghiệm 2</div>-->
<!--            <div class="test-case-status failed">✗ Không qua</div>-->
<!--        </div>-->
    </div>

    <!-- Buttons -->
    <div class="button-group">
        <button class="run-button">Chạy code</button>
        <button class="submit-button">Nộp</button>
    </div>

    <!-- Footer -->
    <div th:replace="~{ClientTemplates/layout/footer :: footer}"></div>

    <script th:src="@{/ClientStatic/js/script.js}"></script>
</body>

</html>
