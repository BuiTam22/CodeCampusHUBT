<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Chỉnh sửa bài viết</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
          crossorigin="anonymous"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
          crossorigin="anonymous"/>
    <link rel="stylesheet" th:href="@{/ClientStatic/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/ClientStatic/css/header.css}"/>
    <link rel="stylesheet" th:href="@{/ClientStatic/css/footer.css}"/>
    <link rel="stylesheet" th:href="@{/ClientStatic/css/blog-detail.css}"/>
</head>
<body>
<div class="page-wrapper">
    <div th:replace="~{ClientTemplates/layout/header :: header}"></div>

    <div class="blog-detail-wrapper">
        <div class="blog-edit-box">
            <h2 class="blog-edit-title">Chỉnh sửa bài viết</h2>
            <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form th:action="@{/blog/{slug}/edit(slug=${post.slug})}" method="post">
                <div class="form-group">
                    <label for="title">Tiêu đề *</label>
                    <input id="title" name="title" class="form-control" required maxlength="255"
                           th:value="${post.title}"/>
                </div>
                <div class="form-group">
                    <label for="thumbnailUrl">Thumbnail URL</label>
                    <input id="thumbnailUrl" name="thumbnailUrl" class="form-control"
                           th:value="${post.thumbnailUrl}"/>
                </div>
                <div class="form-group">
                    <label for="type">Chuyên mục *</label>
                    <select id="type" name="type" class="form-control" required>
                        <option value="regular" th:selected="${post.type == 'regular'}">General</option>
                        <option value="coding" th:selected="${post.type == 'coding'}">Coding</option>
                        <option value="career" th:selected="${post.type == 'career'}">Career</option>
                        <option value="learning" th:selected="${post.type == 'learning'}">Learning</option>
                        <option value="tips" th:selected="${post.type == 'tips'}">Tips</option>
                        <option value="news" th:selected="${post.type == 'news'}">News</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="content">Nội dung *</label>
                    <textarea id="content" name="content" class="form-control" rows="10" required
                              th:text="${post.content}"></textarea>
                </div>
                <div class="blog-edit-actions">
                    <a th:href="@{/blog/{slug}(slug=${post.slug})}" class="btn btn-outline-secondary">Hủy</a>
                    <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{ClientTemplates/layout/footer :: footer}"></div>
</div>
</body>
</html>
