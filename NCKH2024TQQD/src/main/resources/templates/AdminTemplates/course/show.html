<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>Quản lý khóa học | CODEHUBT Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/AdminStatic/css/admin-theme.css}" rel="stylesheet"/>
</head>
<body>

<div th:replace="~{AdminTemplates/layout/sidebar :: sidebar('course')}"></div>

<div class="admin-wrapper" style="margin-left: var(--sidebar-width);">
    <div th:replace="~{AdminTemplates/layout/header :: header('Quản lý khóa học', 'course')}"></div>

    <main class="admin-content">
        <div class="page-header d-flex justify-between align-center">
            <div>
                <h1 class="page-title">Khóa học</h1>
                <p class="page-subtitle">Danh sách tất cả khóa học trong hệ thống.</p>
            </div>
            <button class="btn-admin btn-primary-admin" onclick="AdminNotify.openModal('modal-add-course')">
                <i class="fas fa-plus"></i> Thêm khóa học
            </button>
        </div>

        <div class="admin-card">
            <div class="admin-card-header">
                <span class="admin-card-title">Danh sách khóa học</span>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-course" placeholder="Tìm kiếm khóa học..." oninput="filterCourses(this.value)"/>
                </div>
            </div>
            <div id="courseList" class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Tên khóa học</th>
                            <th>Giá</th>
                            <th>Giảm giá</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="courseTableBody">
                        <tr>
                            <td colspan="6" style="text-align:center;padding:32px;color:var(--text-muted)">
                                <i class="fas fa-spinner fa-spin"></i> Đang tải...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:replace="~{AdminTemplates/layout/footer :: footer}"></div>
    </main>
</div>

<!-- MODAL: ADD COURSE -->
<div class="modal-overlay" id="modal-add-course">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title"><i class="fas fa-plus-circle" style="color:var(--primary);margin-right:8px"></i>Thêm khóa học mới</span>
            <button class="modal-close" onclick="AdminNotify.closeModal('modal-add-course')">×</button>
        </div>
        <div class="modal-body">
            <form id="addCourseForm" onsubmit="submitAddCourse(event)">
                <div class="form-group">
                    <label class="form-label">Tên khóa học *</label>
                    <input class="form-control-admin" type="text" name="title" required placeholder="Nhập tên khóa học"/>
                </div>
                <div class="form-group">
                    <label class="form-label">Mô tả</label>
                    <textarea class="form-control-admin" name="description" rows="3" placeholder="Mô tả khóa học"></textarea>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                    <div class="form-group">
                        <label class="form-label">Giá</label>
                        <input class="form-control-admin" type="number" name="price" min="0" value="0" placeholder="0"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Giá giảm</label>
                        <input class="form-control-admin" type="number" name="discountPrice" min="0" placeholder="0"/>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-admin btn-outline-admin" onclick="AdminNotify.closeModal('modal-add-course')">Hủy</button>
            <button class="btn-admin btn-primary-admin" onclick="document.getElementById('addCourseForm').requestSubmit()">
                <i class="fas fa-save"></i> Lưu
            </button>
        </div>
    </div>
</div>

<!-- MODAL: EDIT COURSE -->
<div class="modal-overlay" id="modal-edit-course">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title"><i class="fas fa-graduation-cap" style="color:var(--primary);margin-right:8px"></i>Chỉnh sửa khóa học</span>
            <button class="modal-close" onclick="AdminNotify.closeModal('modal-edit-course')">×</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="edit-courseId"/>
            <div class="form-group">
                <label class="form-label">Tên khóa học *</label>
                <input class="form-control-admin" type="text" id="edit-courseTitle" placeholder="Tên khóa học"/>
            </div>
            <div class="form-group">
                <label class="form-label">Mô tả</label>
                <textarea class="form-control-admin" id="edit-courseDesc" rows="3" placeholder="Mô tả khóa học"></textarea>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <div class="form-group">
                    <label class="form-label">Giá</label>
                    <input class="form-control-admin" type="number" id="edit-coursePrice" min="0" placeholder="0"/>
                </div>
                <div class="form-group">
                    <label class="form-label">Giá giảm</label>
                    <input class="form-control-admin" type="number" id="edit-courseDiscount" min="0" placeholder="0"/>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-admin btn-outline-admin" onclick="AdminNotify.closeModal('modal-edit-course')">Hủy</button>
            <button class="btn-admin btn-primary-admin" onclick="submitEditCourse()">
                <i class="fas fa-save"></i> Cập nhật
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/AdminStatic/js/admin-notify.js}"></script>
<script th:src="@{/AdminStatic/js/scriptsCourse.js}"></script>
</body>
</html>
