<!-- HEADER FRAGMENT -->
<div th:fragment="header(pageTitle, activePage)">
    <header class="admin-topbar">
        <!-- Breadcrumb / Page Title -->
        <div class="topbar-breadcrumb">
            <a href="/admin/dashboard/show"><i class="fas fa-house"></i></a>
            <span class="sep">/</span>
            <span class="current" th:text="${pageTitle}">Dashboard</span>
        </div>

        <!-- Actions -->
        <div class="topbar-actions">
            <!-- Notification bell -->
            <button class="topbar-btn" title="Thông báo">
                <i class="fas fa-bell"></i>
                <span class="topbar-badge"></span>
            </button>

            <div class="topbar-divider"></div>

            <!-- User dropdown (Bootstrap 5) -->
            <div class="dropdown">
                <a class="topbar-user" href="#" id="userDropdown"
                   data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="topbar-user-avatar"
                         th:text="${username != null ? username.substring(0,1).toUpperCase() : 'A'}">A</div>
                    <span class="topbar-user-name" th:text="${username != null ? username : 'Admin'}">Admin</span>
                    <i class="fas fa-chevron-down" style="font-size:10px;color:var(--text-muted);margin-left:2px"></i>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0"
                    style="border-radius:10px;min-width:160px;font-size:13px"
                    aria-labelledby="userDropdown">
                    <li>
                        <a class="dropdown-item d-flex align-items-center gap-2" href="#">
                            <i class="fas fa-user-cog" style="width:16px;color:var(--text-muted)"></i>Cài đặt
                        </a>
                    </li>
                    <li><hr class="dropdown-divider my-1"></li>
                    <li>
                        <a class="dropdown-item d-flex align-items-center gap-2 text-danger"
                           href="/logout">
                            <i class="fas fa-right-from-bracket" style="width:16px"></i>Đăng xuất
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </header>
</div>
