<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content="CODEHUBT Admin Dashboard"/>
    <title>Dashboard | CODEHUBT Admin</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <!-- FontAwesome -->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Admin Theme -->
    <link th:href="@{/AdminStatic/css/admin-theme.css}" rel="stylesheet"/>
</head>
<body>

<!-- Sidebar -->
<div th:replace="~{AdminTemplates/layout/sidebar :: sidebar('dashboard')}"></div>

<div class="admin-wrapper" style="margin-left: var(--sidebar-width);">
    <!-- Header -->
    <div th:replace="~{AdminTemplates/layout/header :: header('Dashboard', 'dashboard')}"></div>

    <!-- Content -->
    <main class="admin-content">

        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title">Bảng điều khiển</h1>
            <p class="page-subtitle">Chào mừng trở lại! Đây là tổng quan hệ thống.</p>
        </div>

        <!-- Stat Cards -->
        <div class="stat-grid">
            <div class="stat-card">
                <div class="stat-icon green"><i class="fas fa-users"></i></div>
                <div>
                    <div class="stat-value" id="stat-users">—</div>
                    <div class="stat-label">Tổng người dùng</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fas fa-graduation-cap"></i></div>
                <div>
                    <div class="stat-value" id="stat-courses">—</div>
                    <div class="stat-label">Khóa học</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange"><i class="fas fa-book-open"></i></div>
                <div>
                    <div class="stat-value" id="stat-lessons">—</div>
                    <div class="stat-label">Bài học</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple"><i class="fas fa-shield-halved"></i></div>
                <div>
                    <div class="stat-value" id="stat-roles">—</div>
                    <div class="stat-label">Vai trò</div>
                </div>
            </div>
        </div>

        <!-- Quick Links -->
        <div class="admin-card">
            <div class="admin-card-header">
                <span class="admin-card-title">Truy cập nhanh</span>
            </div>
            <div class="admin-card-body">
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px">
                    <a href="/admin/user/show" class="btn-admin btn-outline-admin" style="justify-content:center;padding:14px">
                        <i class="fas fa-users"></i> Người dùng
                    </a>
                    <a href="/admin/course/show" class="btn-admin btn-outline-admin" style="justify-content:center;padding:14px">
                        <i class="fas fa-graduation-cap"></i> Khóa học
                    </a>
                    <a href="/admin/lesson/show" class="btn-admin btn-outline-admin" style="justify-content:center;padding:14px">
                        <i class="fas fa-book-open"></i> Bài học
                    </a>
                    <a href="/admin/role/show" class="btn-admin btn-outline-admin" style="justify-content:center;padding:14px">
                        <i class="fas fa-shield-halved"></i> Phân quyền
                    </a>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div th:replace="~{AdminTemplates/layout/footer :: footer}"></div>
    </main>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/AdminStatic/js/admin-notify.js}"></script>
<script>
    // Load quick stats from APIs
    async function loadStats() {
        try {
            const [users, courses, lessons, roles] = await Promise.all([
                fetch('/admin/api/user/show').then(r => r.json()).catch(() => []),
                fetch('/admin/api/course/show').then(r => r.json()).catch(() => []),
                fetch('/admin/api/lesson/show').then(r => r.json()).catch(() => []),
                fetch('/admin/api/role/show').then(r => r.json()).catch(() => []),
            ]);
            document.getElementById('stat-users').textContent   = users.length   ?? '—';
            document.getElementById('stat-courses').textContent = courses.length  ?? '—';
            document.getElementById('stat-lessons').textContent = lessons.length  ?? '—';
            document.getElementById('stat-roles').textContent   = [...new Set(roles.map(r => r.roleName))].length ?? '—';
        } catch(e) {
            console.warn('Could not load stats', e);
        }
    }
    loadStats();
</script>
</body>
</html>
