<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>Quản lý người dùng | CODEHUBT Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/AdminStatic/css/admin-theme.css}" rel="stylesheet"/>
</head>
<body>

<!-- Sidebar -->
<div th:replace="~{AdminTemplates/layout/sidebar :: sidebar('user')}"></div>

<div class="admin-wrapper" style="margin-left: var(--sidebar-width);">
    <!-- Header -->
    <div th:replace="~{AdminTemplates/layout/header :: header('Quản lý người dùng', 'user')}"></div>

    <main class="admin-content">
        <!-- Page Header -->
        <div class="page-header d-flex justify-between align-center">
            <div>
                <h1 class="page-title">Người dùng</h1>
                <p class="page-subtitle">Quản lý tài khoản và phân quyền người dùng.</p>
            </div>
            <button class="btn-admin btn-primary-admin" onclick="AdminNotify.openModal('modal-add-user')">
                <i class="fas fa-plus"></i> Thêm người dùng
            </button>
        </div>

        <!-- Table Card -->
        <div class="admin-card">
            <div class="admin-card-header">
                <span class="admin-card-title">Danh sách tài khoản</span>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-user" placeholder="Tìm kiếm người dùng..." oninput="filterUsers(this.value)"/>
                </div>
            </div>
            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Tài khoản</th>
                            <th>Email</th>
                            <th>Vai trò</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="5" style="text-align:center;padding:32px;color:var(--text-muted)">
                                <i class="fas fa-spinner fa-spin"></i> Đang tải...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- Pagination -->
            <div style="padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
                <span id="page-info" style="font-size:12px;color:var(--text-muted)"></span>
                <div id="pagination" style="display:flex;gap:6px"></div>
            </div>
        </div>

        <div th:replace="~{AdminTemplates/layout/footer :: footer}"></div>
    </main>
</div>

<!-- ============ MODAL: ADD USER ============ -->
<div class="modal-overlay" id="modal-add-user">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title"><i class="fas fa-user-plus" style="color:var(--primary);margin-right:8px"></i>Thêm người dùng</span>
            <button class="modal-close" onclick="AdminNotify.closeModal('modal-add-user')">×</button>
        </div>
        <div class="modal-body">
            <form id="addUserForm" onsubmit="submitAddUser(event)">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                    <div class="form-group" style="grid-column:1/-1">
                        <label class="form-label">Tên tài khoản *</label>
                        <input class="form-control-admin" type="text" name="userName" required
                               pattern="[a-z0-9]+" title="Chỉ dùng chữ thường và số, không dấu, không khoảng trắng"
                               placeholder="vd: nguyenvana"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email *</label>
                        <input class="form-control-admin" type="email" name="email" required placeholder="email@example.com"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mật khẩu *</label>
                        <input class="form-control-admin" type="password" name="password" required placeholder="••••••••"/>
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label class="form-label">Họ và tên *</label>
                        <input class="form-control-admin" type="text" name="fullName" required placeholder="Nguyễn Văn A"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Ngày sinh</label>
                        <input class="form-control-admin" type="date" name="dateOfBirth"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Số điện thoại</label>
                        <input class="form-control-admin" type="text" name="phoneNumber" placeholder="0901234567"/>
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label class="form-label">Địa chỉ</label>
                        <input class="form-control-admin" type="text" name="address" placeholder="Hà Nội, Việt Nam"/>
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label class="form-label">Vai trò *</label>
                        <select class="form-control-admin" name="roleName">
                            <option value="STUDENT">STUDENT</option>
                            <option value="TEACHER">TEACHER</option>
                            <option value="ADMIN">ADMIN</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-admin btn-outline-admin" onclick="AdminNotify.closeModal('modal-add-user')">Hủy</button>
            <button class="btn-admin btn-primary-admin" onclick="document.getElementById('addUserForm').requestSubmit()">
                <i class="fas fa-save"></i> Lưu
            </button>
        </div>
    </div>
</div>

<!-- ============ MODAL: EDIT USER ============ -->
<div class="modal-overlay" id="modal-edit-user">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title"><i class="fas fa-user-pen" style="color:var(--primary);margin-right:8px"></i>Chỉnh sửa người dùng</span>
            <button class="modal-close" onclick="AdminNotify.closeModal('modal-edit-user')">×</button>
        </div>
        <div class="modal-body">
            <form id="editUserForm" enctype="multipart/form-data">
                <input type="hidden" name="userId" id="edit-userId"/>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                    <div class="form-group">
                        <label class="form-label">Tên tài khoản</label>
                        <input class="form-control-admin" type="text" name="userName" id="edit-userName" placeholder="username"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input class="form-control-admin" type="email" name="email" id="edit-email" placeholder="email@example.com"/>
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label class="form-label">Họ và tên</label>
                        <input class="form-control-admin" type="text" name="fullName" id="edit-fullName" placeholder="Họ và tên đầy đủ"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Ngày sinh</label>
                        <input class="form-control-admin" type="date" name="dateOfBirth" id="edit-dob"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Số điện thoại</label>
                        <input class="form-control-admin" type="text" name="phoneNumber" id="edit-phone"/>
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label class="form-label">Địa chỉ</label>
                        <input class="form-control-admin" type="text" name="address" id="edit-address"/>
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label class="form-label">Ảnh đại diện</label>
                        <input class="form-control-admin" type="file" name="image" id="edit-image" accept="image/*"/>
                    </div>
                    <div class="form-group" style="grid-column:1/-1">
                        <label class="form-label">Vai trò</label>
                        <div id="roleCheckboxes" style="display:flex;gap:12px;flex-wrap:wrap;padding:8px 0"></div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-admin btn-outline-admin" onclick="AdminNotify.closeModal('modal-edit-user')">Hủy</button>
            <button class="btn-admin btn-primary-admin" onclick="submitEditUser()">
                <i class="fas fa-save"></i> Cập nhật
            </button>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/AdminStatic/js/admin-notify.js}"></script>
<script th:inline="javascript">
    var apiBaseUrl = /*[[${@environment.getProperty('api.base.url')}]]*/ "";
</script>
<script th:src="@{/AdminStatic/js/User.js}"></script>
</body>
</html>
